[project]
name = "musical-memory"
version = "0.1.0"
description = "Turns a family routine into a short, checked song for a young child."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
web = ["fastapi>=0.160", "jinja2>=3.1", "uvicorn>=0.50"]
# Only needed to call a paid provider. See the note on trust() in adapters/elevenlabs.py.
real = ["truststore>=0.9", "certifi>=2024.2"]
dev = ["musical-memory[web]", "musical-memory[real]", "pytest>=8", "ruff>=0.6", "mypy>=1.10", "httpx2>=2.16"]

[project.scripts]
mm = "mm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mm = ["web/templates/*.html", "web/static/*", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
